{% set name = "syft" %}
{% set version = "1.51.1" %}

package:
  name: {{ name|lower }}
  version: {{ version|replace("-", "_") }}

source:
  - url: https://github.com/anchore/syft/archive/v{{ version }}.tar.gz
    sha256: da8d83cdca78f2c553e08a5ecb9734016a05adb904168531f582bebfbb9bb2cf
    folder: src
  - url: https://gitlab.com/cznic/mathutil/-/raw/b13e5b5643328f15fd2fcedc85f647f0d8f9180f/LICENSE  # v1.5.0
    sha256: bfa9bf72a72ca009fd62a8f84fca3dca67e51d93af96352723646599898b6cf5
    fn: LICENSE-mathutil
  - url: https://raw.githubusercontent.com/xi2/xz/48954b6210f8d154cb5f8484d3a3e1f83489309e/LICENSE
    sha256: 5c640056d513f276d56635af7a0bed81cb7eac02a31b6e56d40c416557a8d8ce
    fn: LICENSE-xz
  - url: https://raw.githubusercontent.com/deitch/magic/2def47b612f6f806d1e136bbec1c34fdefacf04a/LICENSE
    sha256: 2423c6eb9948e617a61f7a2d1cb463c69d60e599fbae5931551631d2a8730838
    fn: LICENSE-magic

build:
  number: 0
  # go-licenses cannot resolve some vendored LICENSE files on Windows.
  skip: True  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - syft --version | grep {{ version }}  # [unix]
    - syft.exe --version | findstr {{ version }}  # [win]

about:
  home: https://github.com/anchore/syft
  dev_url: https://github.com/anchore/syft
  doc_url: https://oss.anchore.com/docs/architecture/syft/
  license: Apache-2.0
  license_family: APACHE
  license_file:
    - src/LICENSE
    - library_licenses/
    - LICENSE-xz
    - LICENSE-mathutil
    - LICENSE-magic
  summary: CLI tool and library for generating a Software Bill of Materials from container images and filesystems
  description: CLI tool and library for generating a Software Bill of Materials from container images and filesystems

extra:
  recipe-maintainers:
    - janjagusch
